[build-system]
requires = ["scikit-build-core>=0.10,<1"]
build-backend = "scikit_build_core.build"

[project]
name = "warpSPHCore"
version = "0.6.3"
description = "GPU-accelerated SPH neighbor search and operators built with NVIDIA Warp and PyTorch"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sph", "warp", "pytorch", "fluid-simulation", "neighbor-search", "crksph"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
warp = ["warp-lang"]
native = ["ninja"]
notebooks = [
    "matplotlib",
    "ipympl",
    "ipywidgets",
    "pandas",
    "seaborn",
    "tqdm",
]
dev = [
    "warp-lang",
    "ninja",
    "pytest",
    "build",
    "scikit-build-core>=0.10,<1",
    "wheel",
    "twine",
    # tests/kernels/test_kernel_audit.py + scripts/kernels/kernel_audit.py
    # read scripts/kernels/kernel_specs.yaml
    "pyyaml",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/warpSPHCore"]
wheel.py-api = "py3"
sdist.include = ["CMakeLists.txt", "scripts/packaging/*.py", "src/**"]
