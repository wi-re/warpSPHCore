[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sphWarpCore"
version = "0.1.0"
description = "SPH (Smoothed Particle Hydrodynamics) core operations using NVIDIA Warp and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sph", "warp", "pytorch", "fluid-simulation", "neighbor-search"]
dependencies = [
    "torch",
    "warp-lang",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]
