name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install warpSPHCore (dev extras)
        run: pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest tests/ -v

      - name: Check Warp-free native CPU capabilities
        env:
          WARPSPHCORE_BACKEND: native
          WARPSPHCORE_NATIVE_BUILD: cpu
          MAX_JOBS: "2"
        run: pytest tests/native/test_native.py tests/native/test_layout.py tests/native/test_build.py tests/native/test_kernels.py tests/native/test_primal.py tests/native/test_autograd.py -q

      - name: Build and check compiler-free stable-ABI CPU wheel
        run: |
          python scripts/packaging/build_native_wheel.py --backend cpu --output /tmp/warpsph-native-wheel
          python scripts/packaging/check_native_wheel.py /tmp/warpsph-native-wheel/*.whl --tests
          python scripts/packaging/audit_native_abi.py /tmp/warpsph-native-wheel/*.whl

      - name: Check integer widths independently of precision
        run: python scripts/diagnostics/qualify_index_types.py --device cpu --output /tmp/index-types.json

      - name: Check isolated wheel and public examples in both precisions
        run: |
          python -m build --wheel --outdir /tmp/warpsphcore-wheel
          python scripts/packaging/check_wheel.py /tmp/warpsphcore-wheel/*.whl

      - name: Run operation matrix (2D, float32, non-jittered, CI gate)
        run: python scripts/diagnostics/operation_matrix.py --device cpu --ci --verbose

      - name: Run operation matrix (2D, float64, CI gate)
        run: python scripts/diagnostics/operation_matrix.py --device cpu --precision float64 --nx 24 --ci --verbose

      - name: Run operation matrix (1D, CI gate)
        run: python scripts/diagnostics/operation_matrix.py --device cpu --dim 1 --nx 64 --ci --verbose

      - name: Run operation matrix (jittered, CI gate)
        run: python scripts/diagnostics/operation_matrix.py --device cpu --jitter 0.01 --ci --verbose

      - name: Run operation matrix (3D, CUDA only)
        run: |
          if python -c "import torch, sys; sys.exit(0 if torch.cuda.is_available() else 1)"; then
            python scripts/diagnostics/operation_matrix.py --device cuda --dim 3 --nx 8 --ci --verbose
          else
            echo "No CUDA device on this runner; skipping the 3D matrix (dim=3 is CPU-prohibitive, see warpier_core.md)."
          fi
